  status = 200
  force = true

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/assets/brand/wild-ones-emblem-approved.svg"
  status = 200
  force = true

[[redirects]]
  from = "https://www.wildonesllc.com/*"
  to = "https://wildonesllc.com/:splat"
  status = 301
  force = true

