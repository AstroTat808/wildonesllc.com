[build]
  publish = "dist"
  command = "npm run qa:netlify"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/favicon.ico"
  to = "/assets/brand/wild-ones-emblem-approved.svg"
  status = 200
  force = true

[[redirects]]
  from = "/favicon-32x32.png"
  to = "/assets/brand/wild-ones-emblem-approved.svg"
  status = 200
  force = true

[[redirects]]
  from = "/favicon-16x16.png"
